<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotkey</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <header class="header">
        <h1>Hotkey</h1>
        <p class="muted">
          Глобальные хоткеи для запуска программ. Если ОС не позволяет
          зарегистрировать сочетание — будет ошибка.
        </p>
      </header>

      <section class="card">
        <h2>Добавить хоткей</h2>
        <div class="form-grid">
          <label for="name-input">Название</label>
          <input
            id="name-input"
            placeholder="Например: Браузер, IDE, Терминал"
            autocomplete="off"
          />

          <label for="combo-input">Комбинация</label>
          <div class="combo-row">
            <input id="combo-input" readonly placeholder="Кликни и нажми сочетание…" />
            <button id="combo-clear" type="button">Очистить</button>
          </div>

          <label for="program-input">Программа</label>
          <div class="program-row">
            <input
              id="program-input"
              placeholder="C:\\Path\\app.exe или /usr/bin/app"
              autocomplete="off"
            />
            <button id="program-pick-btn" type="button">Выбрать файл</button>
          </div>

          <label for="args-input">Аргументы</label>
          <input id="args-input" placeholder='--flag "value with spaces"' autocomplete="off" />

          <div class="actions">
            <button id="add-btn" type="button">Добавить</button>
            <div id="add-error" class="error"></div>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>Хоткеи</h2>
        <div id="list" class="list"></div>
      </section>
    </main>
  </body>
</html>
